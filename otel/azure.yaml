# Azure Application Insights. Set APPLICATIONINSIGHTS_CONNECTION_STRING in .env.
exporters:
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [azuremonitor] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [azuremonitor] }
    logs:    { receivers: [otlp], processors: [batch], exporters: [azuremonitor] }
